# Netlify settings. Netlify runs the build on every push and publishes the result.
[build]
  command = "python3 build.py"
  publish = "."

# Pull-request previews and branch deploys use the same build.
[context.deploy-preview]
  command = "python3 build.py"

# Pages always check for the latest version; styles and scripts carry a ?v= version tag,
# so browsers can keep them for a year; images and the film for a week.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Keep the build tools and source files off the public site.
[[redirects]]
  from = "/build.py"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true
